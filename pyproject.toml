[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-modeling-ai-decision-support"
version = "0.1.0"
description = "End-to-end credit risk modeling and AI decision support platform."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
